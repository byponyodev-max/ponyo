# Production/staging stack.
# Supply SITE_DOMAIN, ADMIN_DOMAIN, SUPPLIER_DOMAIN, API_DOMAIN, COOKIE_DOMAIN,
# and TLS_EMAIL with --env-file.
# Copy backend/.env.example to backend/.env.prod and fill its production values.
# Production requires SMTP. Leave Stripe keys blank while payments are disabled;
# configure both Stripe keys and SQS before enabling production payments.
#
# Example:
# docker compose --env-file backend/.env.prod -f docker-compose.prod.yml config
# docker compose --env-file backend/.env.prod -f docker-compose.prod.yml run --rm api alembic upgrade head
# docker compose --env-file backend/.env.prod -f docker-compose.prod.yml up -d --build

name: ponyo-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env.prod}
      SUPPLIER_DOMAIN: ${SUPPLIER_DOMAIN:?Set SUPPLIER_DOMAIN in .env.prod}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.prod}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ponyo
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PONYO_API_BASE_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env.prod}
        NEXT_PUBLIC_ADMIN_PORTAL_HOST: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env.prod}
        NEXT_PUBLIC_SUPPLIER_PORTAL_HOST: ${SUPPLIER_DOMAIN:?Set SUPPLIER_DOMAIN in .env.prod}
        PONYO_LOCAL_PREVIEW: "false"
        PONYO_DEV_API_PROXY: "false"
        PONYO_DEV_API_PROXY_TARGET: http://api:8000
        PONYO_ALLOW_CLOUDFLARE_QUICK_TUNNEL: "false"
    restart: unless-stopped
    init: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ADMIN_PORTAL_HOST: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env.prod}
      NEXT_PUBLIC_SUPPLIER_PORTAL_HOST: ${SUPPLIER_DOMAIN:?Set SUPPLIER_DOMAIN in .env.prod}
      PONYO_LOCAL_PREVIEW: "false"
      PONYO_DEV_API_PROXY: "false"
      PONYO_DEV_API_PROXY_TARGET: http://api:8000
      PONYO_ALLOW_CLOUDFLARE_QUICK_TUNNEL: "false"
      PONYO_API_SERVER_BASE_URL: http://api:8000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ponyo
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env.prod
    environment:
      ENVIRONMENT: production
      STOREFRONT_BASE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod}
      FRONTEND_ORIGINS: "https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.prod},https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env.prod},https://${SUPPLIER_DOMAIN:?Set SUPPLIER_DOMAIN in .env.prod}"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Set COOKIE_DOMAIN in .env.prod}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      REDIS_URL: redis://redis:6379/0
      LIBRETRANSLATE_URL: http://libretranslate:5000
      STRIPE_SUCCESS_URL: https://${SITE_DOMAIN}/orders?checkout=success
      STRIPE_CANCEL_URL: https://${SITE_DOMAIN}/checkout?checkout=cancelled
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      libretranslate:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ponyo
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ponyo
    logging: *default-logging

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    command: ["--load-only", "en,ja,ko"]
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; payload=json.dumps({"q":"Ready","source":"en","target":"ja","format":"text"}).encode(); request=urllib.request.Request("http://127.0.0.1:5000/translate", data=payload, headers={"Content-Type":"application/json"}); result=json.load(urllib.request.urlopen(request, timeout=5)); assert isinstance(result.get("translatedText"), str) and result["translatedText"].strip()
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - ponyo
    logging: *default-logging

networks:
  ponyo:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
