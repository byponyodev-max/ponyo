name: Frontend checks

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/frontend.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PONYO_API_BASE_URL: /ponyo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
